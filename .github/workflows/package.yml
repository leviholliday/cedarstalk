name: package

# Rebuilds the tidy download on every push, so the website's link is always current.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-package.sh
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "cedarstalk" --notes "Built automatically from main. Most people want cedarstalk.zip -- or just use https://cedarstalk.netlify.app."
          gh release upload latest dist/cedarstalk.zip --clobber
