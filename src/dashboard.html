<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cedarstalk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #ece7df;
        --dim: #8b8378;
        --bg: #14120f;
        --panel: #1c1916;
        --line: #2b2621;
        --pink: #ff87d7;
        --blue: #3987e5;
        --aqua: #199e70;
        --violet: #9085e9;
        --orange: #d95926;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.6 "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        padding: 2rem 1.5rem 4rem;
      }
      main { max-width: 1080px; margin: 0 auto; }
      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 2.75rem;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      h1 em { color: var(--pink); font-style: italic; }
      header p { color: var(--dim); margin-top: 0.25rem; }
      h2 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 1.4rem;
        font-weight: 400;
        margin: 2.5rem 0 0.2rem;
      }
      p.note { color: var(--dim); font-size: 11px; margin-bottom: 0.85rem; }
      section { border-top: 1px solid var(--line); padding-top: 0.25rem; }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        margin-top: 1.5rem;
      }
      .tile { background: var(--panel); padding: 0.9rem 1rem; }
      .tile b { display: block; font-size: 1.7rem; font-weight: 500; letter-spacing: -0.02em; }
      .tile span { color: var(--dim); font-size: 11px; }
      .two { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
      @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
      table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
      th {
        text-align: left;
        color: var(--dim);
        font-weight: 400;
        font-size: 11px;
        padding: 0.35rem 0.6rem 0.35rem 0;
        border-bottom: 1px solid var(--line);
      }
      td { padding: 0.28rem 0.6rem 0.28rem 0; border-bottom: 1px solid var(--line); }
      td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
      .bar { display: inline-block; height: 9px; border-radius: 0 2px 2px 0; }
      .wrap { overflow-x: auto; }
      svg { display: block; width: 100%; height: auto; overflow: visible; }
      .grid { stroke: var(--line); stroke-width: 1; }
      .axis { fill: var(--dim); font-size: 9px; font-family: "JetBrains Mono", monospace; }
      .cell { stroke: var(--bg); stroke-width: 2; }
      .series { fill: none; stroke-width: 2; }
      .legend { display: flex; gap: 1rem; flex-wrap: wrap; color: var(--dim); font-size: 11px; }
      .swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      #tip {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 0.35rem 0.55rem;
        font-size: 11px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s;
        z-index: 5;
        white-space: nowrap;
      }
      .gate { max-width: 460px; margin: 4rem auto; }
      input {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--ink);
        font: inherit;
        padding: 0.6rem 0.7rem;
        margin: 0.75rem 0;
      }
      button {
        background: var(--pink);
        color: #14120f;
        border: 0;
        font: inherit;
        font-weight: 700;
        padding: 0.5rem 1.1rem;
        cursor: pointer;
      }
      button.link { background: none; color: var(--blue); padding: 0; font-weight: 400; }
      .row { display: flex; gap: 0.5rem; align-items: center; }
      .err { color: var(--pink); }
      a { color: var(--blue); }
      footer { color: var(--dim); margin-top: 3rem; font-size: 11px; }
    </style>
  </head>
  <body>
    <main id="app">
      <header>
        <h1>cedar<em>stalk</em></h1>
        <p>the directory, the catalog, the book, the booklists and the campus, in one place</p>
      </header>
      <div id="body"></div>
      <footer>
        <span id="foot"></span> ·
        <a href="/map">campus map</a> ·
        <a href="/mobile">mobile</a> ·
        <a href="/openapi.json">openapi.json</a> ·
        <button type="button" id="forget" class="link">forget token</button>
      </footer>
    </main>
    <div id="tip"></div>

    <script type="module">
      const KEY = "cedarengine.token";
      // Opened by the launcher or desktop shortcut: trade its one-time key for
      // the token, so this works in whichever browser the window opened in.
      const launchKey = new URLSearchParams(location.search).get("key");
      if (launchKey) {
        const claimed = await fetch("/setup/claim", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ key: launchKey }),
        }).catch(() => null);
        if (claimed?.ok) localStorage.setItem(KEY, (await claimed.json()).token);
        history.replaceState(null, "", location.pathname);
      }
      const el = document.getElementById("body");
      const foot = document.getElementById("foot");
      const tip = document.getElementById("tip");
      const n = (v) => Math.round(v ?? 0).toLocaleString("en-US");
      const pct = (v) => `${Math.round((v ?? 0) * 100)}%`;
      const escape = (text) =>
        String(text ?? "").replace(/[<>&"]/g, (c) => `&#${c.charCodeAt(0)};`);

      // Set once glossary lands, read by any view function that needs to turn
      // a registrar code into a word — module-scoped so it isn't re-threaded
      // through every view function's arguments.
      let classes = {};
      const className = (code) => classes[code] ?? code;

      const api = async (path) => {
        const res = await fetch(path, {
          headers: { authorization: `Bearer ${localStorage.getItem(KEY) ?? ""}` },
        });
        if (res.status === 401) throw new Error("unauthorised");
        if (!res.ok) throw new Error(`${path} returned ${res.status}`);
        return res.json();
      };

      // Categorical hues, checked against this background rather than picked by
      // eye — the same six the map uses, in the same order.
      const SERIES = ["#3987e5", "#199e70", "#c98500", "#d55181", "#9085e9", "#d95926"];
      const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      /** One hue, dark to bright: this is magnitude, so lightness carries it. */
      const ramp = (t) => {
        const from = [34, 30, 25];
        const to = [255, 135, 215];
        return `rgb(${from.map((c, i) => Math.round(c + (to[i] - c) * t ** 0.7)).join(",")})`;
      };

      // One tooltip, shared by every chart on the page.
      document.addEventListener("mousemove", (event) => {
        const label = event.target?.dataset?.tip;
        if (!label) {
          tip.style.opacity = 0;
          return;
        }
        tip.textContent = label;
        tip.style.opacity = 1;
        tip.style.left = `${Math.min(event.clientX + 14, window.innerWidth - tip.offsetWidth - 8)}px`;
        tip.style.top = `${event.clientY + 16}px`;
      });

      /** Horizontal bars: ranked magnitude, with names too long for an x-axis. */
      const bars = (rows, { ink = "var(--pink)", unit = "" } = {}) => {
        const most = Math.max(1, ...rows.map((row) => row.value));
        return `<div class="wrap"><table>${rows
          .map(
            (row) => `<tr>
              <td>${escape(row.label)}</td>
              <td class="n">${n(row.value)}</td>
              <td style="width:56%"><i class="bar"
                data-tip="${escape(`${row.label}: ${n(row.value)}${unit}`)}"
                style="width:${(row.value / most) * 100}%;background:${ink}"></i></td>
            </tr>`,
          )
          .join("")}</table></div>`;
      };

      /**
       * Weekday × hour, shaded by how many seats are in a room that hour.
       *
       * A heatmap because the question is two-dimensional: not "how busy is
       * Tuesday" but "when on Tuesday".
       */
      function heatmap(cells) {
        const hours = [...new Set(cells.map((c) => c.hour))].sort((a, b) => a - b);
        const days = [1, 2, 3, 4, 5];
        const most = Math.max(1, ...cells.map((c) => c.seats));
        const at = new Map(cells.map((c) => [`${c.day}:${c.hour}`, c]));
        const w = 34;
        const h = 26;
        const left = 34;
        const top = 16;

        const grid = days
          .flatMap((day, row) =>
            hours.map((hour, col) => {
              const cell = at.get(`${day}:${hour}`);
              const seats = cell?.seats ?? 0;
              const clock = `${hour % 12 || 12}${hour < 12 ? "am" : "pm"}`;
              const label = `${DAYS[day]} ${clock} · ${n(seats)} seated · ${n(
                cell?.sections ?? 0,
              )} sections`;
              return `<rect class="cell" x="${left + col * w}" y="${top + row * h}" width="${w}"
                height="${h}" rx="2" fill="${ramp(seats / most)}" data-tip="${escape(label)}"></rect>`;
            }),
          )
          .join("");

        const hourLabels = hours
          .map(
            (hour, col) =>
              `<text class="axis" x="${left + col * w + w / 2}" y="${top - 5}"
                 text-anchor="middle">${hour % 12 || 12}</text>`,
          )
          .join("");
        const dayLabels = days
          .map(
            (day, row) =>
              `<text class="axis" x="${left - 8}" y="${top + row * h + h / 2 + 3}"
                 text-anchor="end">${DAYS[day]}</text>`,
          )
          .join("");

        return `<svg viewBox="0 0 ${left + hours.length * w + 10} ${top + days.length * h + 10}">
            ${hourLabels}${dayLabels}${grid}
          </svg>
          <div class="legend" style="margin-top:0.6rem">
            <span><i class="swatch" style="background:${ramp(0)}"></i>quiet</span>
            <span><i class="swatch" style="background:${ramp(0.5)}"></i>${n(most / 2)}</span>
            <span><i class="swatch" style="background:${ramp(1)}"></i>${n(most)} seated</span>
          </div>`;
      }

      /** Lines over time. One scale only — two would make the crossing a lie. */
      function lines(points, series, { format = n, height = 150 } = {}) {
        if (points.length < 2) {
          return `<p class="note">not enough points to plot yet</p>`;
        }
        const w = 1000;
        const pad = { left: 46, right: 12, top: 12, bottom: 22 };
        const most = Math.max(...series.flatMap((s) => points.map((p) => s.of(p)))) || 1;
        const x = (i) => pad.left + (i / (points.length - 1)) * (w - pad.left - pad.right);
        const y = (v) => height - pad.bottom - (v / most) * (height - pad.top - pad.bottom);

        const grid = [0, 0.5, 1]
          .map(
            (t) => `<line class="grid" x1="${pad.left}" x2="${w - pad.right}" y1="${y(most * t)}"
                y2="${y(most * t)}" />
              <text class="axis" x="${pad.left - 8}" y="${y(most * t) + 3}"
                text-anchor="end">${format(most * t)}</text>`,
          )
          .join("");

        const plotted = series
          .map(
            (s, i) => `<path class="series" stroke="${SERIES[i]}"
              d="${points.map((p, j) => `${j ? "L" : "M"}${x(j)} ${y(s.of(p))}`).join("")}" />
            ${points
              .map(
                (p, j) => `<circle cx="${x(j)}" cy="${y(s.of(p))}" r="4.5" fill="${SERIES[i]}"
                  stroke="var(--bg)" stroke-width="2"
                  data-tip="${escape(`${s.name} · ${p.label} · ${format(s.of(p))}`)}" />`,
              )
              .join("")}`,
          )
          .join("");

        const ticks = points
          .map((p, j) =>
            j === 0 || j === points.length - 1 || points.length < 8
              ? `<text class="axis" x="${x(j)}" y="${height - 6}"
                   text-anchor="middle">${escape(p.label)}</text>`
              : "",
          )
          .join("");

        return `<svg viewBox="0 0 ${w} ${height}">${grid}${plotted}${ticks}</svg>
          <div class="legend" style="margin-top:0.5rem">${series
            .map(
              (s, i) =>
                `<span><i class="swatch" style="background:${SERIES[i]}"></i>${escape(s.name)}</span>`,
            )
            .join("")}</div>`;
      }

      function gate(message = "") {
        el.innerHTML = `<div class="gate">
          <p>This engine holds real people's rooms and phone numbers. Paste the bearer token from your <code>.env</code>.</p>
          <input id="token" type="password" placeholder="BEARER_TOKEN" autofocus />
          <div class="row"><button id="go">Unlock</button><span class="err">${escape(message)}</span></div>
        </div>`;
        const submit = () => {
          localStorage.setItem(KEY, document.getElementById("token").value.trim());
          load();
        };
        document.getElementById("go").onclick = submit;
        // Braces matter: an arrow body returning false from onkeydown cancels the
        // keystroke, and `e.key === "Enter" && submit()` is false for every other
        // key — which is a token box you cannot type into.
        document.getElementById("token").onkeydown = (event) => {
          if (event.key === "Enter") submit();
        };
      }

      const tile = (label, value) => `<div class="tile"><b>${value}</b><span>${label}</span></div>`;
      const fill = (id, html) => {
        const node = document.getElementById(id);
        if (node) node.innerHTML = html;
      };

      const timetableView = (data) => `
        ${heatmap(data.cells)}
        <h2>the fullest subjects</h2>
        <p class="note">seats taken this term, by subject code</p>
        ${bars(
          data.subjects.slice(0, 12).map((s) => ({ label: s.subject, value: s.enrolled })),
          { ink: "var(--aqua)", unit: " enrolled" },
        )}`;

      const walksView = (data) => `
        <p class="note">${n(data.students)} students with both a dorm and a booklist ·
          ${n(data.trips)} journeys · the busiest path carries ${n(data.busiest)}</p>
        ${bars(
          data.destinations.slice(0, 10).map((d) => ({ label: d.label, value: d.trips })),
          { ink: "var(--orange)", unit: " walks" },
        )}`;

      const studyView = (data) => `
        <p class="note">top guess for the ${n(data.confident)} students whose booklist carries
          enough signal to be worth counting, of ${n(data.students)} with any</p>
        ${bars(
          data.schools.map((s) => ({ label: s.school, value: s.students })),
          { ink: "var(--violet)", unit: " students" },
        )}`;

      const roomsView = (data) => {
        if (!data.rooms.length) return `<p class="note">nothing free within the horizon right now</p>`;
        const rows = data.rooms.slice(0, 8);
        return `<div class="wrap"><table>
          <tr><th>room</th><th class="n">quiet</th><th class="n">free for</th></tr>
          ${rows
            .map(
              (r) => `<tr>
                <td>${escape(r.building)} ${escape(r.room)}${r.gem ? " ·" : ""}</td>
                <td class="n">${r.quiet}</td>
                <td class="n">${r.freeMinutes >= 60 ? `${Math.round(r.freeMinutes / 60)}h` : `${n(r.freeMinutes)}m`}</td>
              </tr>`,
            )
            .join("")}
        </table></div>`;
      };

      const facultyView = (data) => `
        <p class="note">sections taught this term, by instructor of record</p>
        ${bars(
          data.faculty.slice(0, 10).map((f) => ({ label: f.faculty, value: f.sections })),
          { ink: "var(--blue)", unit: " sections" },
        )}`;

      const geographyView = (data) => `
        <p class="note">${n(data.scored)} students with a routable schedule ·
          mean metres walked per week, by class</p>
        ${bars(
          data.byBucket.map((b) => ({ label: className(b.bucket), value: b.meanWeeklyMetres })),
          { ink: "var(--orange)", unit: "m/week" },
        )}`;

      const pressureView = (data) => {
        const filling = data.sections.filter((s) => s.fillPerHour > 0).slice(0, 8);
        if (!filling.length) {
          return `<p class="note">no section is losing seats between the last two collects —
            ${n(data.sections.length)} tracked, all steady right now</p>`;
        }
        return bars(
          filling.map((s) => ({ label: s.name ?? s.sectionId, value: s.fillPerHour })),
          { ink: "var(--pink)", unit: " seats/hr" },
        );
      };

      const miles = (v) => `${Math.round(v ?? 0).toLocaleString("en-US")} mi`;

      const curiositiesView = (data) => {
        const d = data.distance;
        const early = data.earlyBirds
          .filter((e) => e.meetings >= 4)
          .slice(0, 8)
          .map((e) => ({ label: e.subject, value: Math.round(e.share * 100) }));
        return `
          <div class="tiles" style="margin-top:0">
            ${tile("median from campus", d.medianMiles === null ? "—" : miles(d.medianMiles))}
            ${tile("mean from campus", d.meanMiles === null ? "—" : miles(d.meanMiles))}
            ${tile(
              d.furthest
                ? `furthest · ${escape(d.furthest.city)}, ${escape(d.furthest.state)}`
                : "furthest",
              d.furthest ? miles(d.furthest.miles) : "—",
            )}
            ${tile(
              `hometowns placed · ${n(d.geocoded)} of ${n(d.ofPeople)}`,
              d.ofPeople ? pct(d.geocoded / d.ofPeople) : "—",
            )}
            ${data.optionalShare ? tile("books marked optional", pct(data.optionalShare.share)) : ""}
          </div>

          <div class="two" style="margin-top:1.5rem">
            <div>
              <p class="note">where they are from, by state</p>
              ${bars(
                data.hometownStates.slice(0, 10).map((s) => ({ label: s.state, value: s.people })),
                { ink: "var(--aqua)", unit: " people" },
              )}
            </div>
            <div>
              <p class="note">share of a subject's meetings starting at or before 8am,
                among subjects that meet at least four times</p>
              ${bars(early, { ink: "var(--orange)", unit: "% early" })}
            </div>
          </div>

          <p class="note" style="margin-top:1.5rem">the books the most people were told to buy</p>
          ${bars(
            data.commonBooks
              .slice(0, 8)
              .map((b) => ({ label: (b.title ?? b.isbn).slice(0, 52), value: b.students })),
            { ink: "var(--violet)", unit: " students" },
          )}

          ${data.notes.map((note) => `<p class="note">· ${escape(note)}</p>`).join("")}`;
      };

      /**
       * Fruchterman-Reingold, settled synchronously rather than animated —
       * ~90 nodes converges in a few hundred iterations well under a frame
       * budget most people would notice, so there is nothing to animate.
       */
      function forceLayout(nodes, edges, { width = 900, height = 480, iterations = 320 } = {}) {
        const pos = new Map(
          nodes.map((node, i) => {
            const angle = (i / nodes.length) * Math.PI * 2;
            return [
              node.code,
              { x: width / 2 + Math.cos(angle) * 140, y: height / 2 + Math.sin(angle) * 140, vx: 0, vy: 0 },
            ];
          }),
        );

        for (let iter = 0; iter < iterations; iter++) {
          for (let i = 0; i < nodes.length; i++) {
            const a = pos.get(nodes[i].code);
            for (let j = i + 1; j < nodes.length; j++) {
              const b = pos.get(nodes[j].code);
              let dx = a.x - b.x;
              let dy = a.y - b.y;
              const distSq = dx * dx + dy * dy || 0.01;
              const dist = Math.sqrt(distSq);
              const force = 5000 / distSq;
              dx /= dist;
              dy /= dist;
              a.vx += dx * force;
              a.vy += dy * force;
              b.vx -= dx * force;
              b.vy -= dy * force;
            }
          }
          for (const edge of edges) {
            const a = pos.get(edge.a);
            const b = pos.get(edge.b);
            if (!a || !b) continue;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
            const force = (dist - 90) * 0.02 * Math.log2(edge.shared + 1);
            const fx = (dx / dist) * force;
            const fy = (dy / dist) * force;
            a.vx += fx;
            a.vy += fy;
            b.vx -= fx;
            b.vy -= fy;
          }
          for (const node of nodes) {
            const p = pos.get(node.code);
            p.vx += (width / 2 - p.x) * 0.002;
            p.vy += (height / 2 - p.y) * 0.002;
            p.vx *= 0.85;
            p.vy *= 0.85;
            p.x = Math.min(width - 20, Math.max(20, p.x + p.vx));
            p.y = Math.min(height - 20, Math.max(20, p.y + p.vy));
          }
        }
        return pos;
      }

      const curriculumView = (data) => {
        if (!data.nodes.length) {
          return `<p class="note">not enough shared enrolment yet to draw a graph — try a lower minShared</p>`;
        }
        const width = 900;
        const height = 480;
        const pos = forceLayout(data.nodes, data.edges, { width, height });
        const mostStudents = Math.max(1, ...data.nodes.map((node) => node.students));
        const mostShared = Math.max(1, ...data.edges.map((edge) => edge.shared));

        const edgeLines = data.edges
          .map((edge) => {
            const a = pos.get(edge.a);
            const b = pos.get(edge.b);
            if (!a || !b) return "";
            const t = edge.shared / mostShared;
            return `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"
              stroke="var(--dim)" stroke-width="${(0.4 + t * 2.2).toFixed(2)}" stroke-opacity="${(0.12 + t * 0.35).toFixed(2)}" />`;
          })
          .join("");

        const nodeCircles = data.nodes
          .map((node) => {
            const p = pos.get(node.code);
            const r = 3 + Math.sqrt(node.students / mostStudents) * 14;
            return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}"
              fill="var(--pink)" fill-opacity="0.85"
              data-tip="${escape(`${node.code} · ${node.students} students`)}"></circle>`;
          })
          .join("");

        const labels = data.nodes
          .filter((node) => node.students >= mostStudents * 0.35)
          .map((node) => {
            const p = pos.get(node.code);
            return `<text class="axis" x="${p.x.toFixed(1)}" y="${(p.y - 10).toFixed(1)}" text-anchor="middle">${escape(node.code)}</text>`;
          })
          .join("");

        return `<svg viewBox="0 0 ${width} ${height}">${edgeLines}${nodeCircles}${labels}</svg>
          <p class="note">${n(data.nodes.length)} courses, ${n(data.edges.length)} pairs sharing at
            least ${data.minShared} students — circle size is enrolment, line weight is overlap</p>`;
      };

      async function load() {
        try {
          const [stats, traffic, glossary] = await Promise.all([
            api("/v1/stats"),
            api("/v1/analytics"),
            api("/v1/glossary"),
          ]);
          classes = glossary.classes;
          render(stats, traffic, glossary);

          // The expensive half, filled in as it lands: a term's timetable,
          // everyone's major guessed, every walk to class routed. The page is
          // worth reading before any of it arrives.
          const term = stats.booklists.at(-1)?.term ?? stats.catalog.terms[0]?.term;
          if (term) {
            api(`/v1/timetable?term=${term}`).then((data) => fill("timetable", timetableView(data)));
          }
          api("/v1/campus/traffic").then((data) => fill("walks", walksView(data)));
          api("/v1/majors/distribution").then((data) => fill("study", studyView(data)));
          api("/v1/rooms/quiet?horizon=30").then((data) => fill("rooms", roomsView(data)));
          api("/v1/faculty").then((data) => fill("faculty", facultyView(data)));
          api("/v1/geography/leaderboard?by=class").then((data) =>
            fill("geography", geographyView(data)),
          );
          api("/v1/pressure/leaderboard").then((data) => fill("pressure", pressureView(data)));
          api("/v1/courses/graph?minShared=3").then((data) =>
            fill("curriculum", curriculumView(data)),
          );
          api("/v1/stats/curiosities").then((data) => fill("curiosities", curiositiesView(data)));
        } catch (error) {
          if (error.message === "unauthorised") gate("that token was not it");
          else el.innerHTML = `<p class="err">${escape(error.message)}</p>`;
        }
      }

      function render(stats, traffic, glossary) {
        const sections = stats.catalog.terms.reduce((sum, t) => sum + t.sections, 0);
        const courses = stats.catalog.terms.reduce((sum, t) => sum + t.courses, 0);
        const booklists = stats.booklists.reduce((sum, t) => sum + t.students, 0);

        el.innerHTML = `
          <div class="tiles">
            ${tile("people", n(stats.people.people))}
            ${tile("students", n(stats.people.students))}
            ${tile("departed", n(stats.people.gone))}
            ${tile("sections", n(sections))}
            ${tile("courses", n(courses))}
            ${tile("programs", n(stats.catalog.programs[0]?.programs ?? 0))}
            ${tile("booklists", n(booklists))}
            ${tile("buildings", n(stats.campus.buildings))}
          </div>

          <section><h2>when campus is in class</h2>
            <p class="note">seats in a room, by weekday and starting hour</p>
            <div id="timetable"><p class="note">reading the timetable…</p></div>
          </section>

          <section><h2>what they study</h2>
            <div id="study"><p class="note">guessing…</p></div>
          </section>

          <section><h2>where they walk</h2>
            <p class="note">arrivals per building, dorm to classroom</p>
            <div id="walks"><p class="note">routing…</p></div>
          </section>

          <section><h2>how far each class walks</h2>
            <div id="geography"><p class="note">routing every schedule…</p></div>
          </section>

          <div class="two">
            <section><h2>empty rooms right now</h2>
              <p class="note">free for at least 30 minutes, quietest first</p>
              <div id="rooms"><p class="note">checking the grid…</p></div>
            </section>
            <section><h2>who teaches the most</h2>
              <div id="faculty"><p class="note">counting…</p></div>
            </section>
          </div>

          <section><h2>fastest-filling sections</h2>
            <p class="note">seats lost per hour, between the last two catalog collects</p>
            <div id="pressure"><p class="note">comparing snapshots…</p></div>
          </section>

          <section><h2>odds and ends</h2>
            <p class="note">the one-shot questions: where they come from, who draws the 8am slots,
              and the book the most people were told to buy</p>
            <div id="curiosities"><p class="note">counting…</p></div>
          </section>

          <section><h2>the shape of the curriculum</h2>
            <p class="note">courses sharing students this term, force-directed — the gen-ed core
              is the hub everything else hangs off</p>
            <div id="curriculum"><p class="note">laying out the graph…</p></div>
          </section>

          <div class="two">
            <section><h2>dorms</h2>
              <p class="note">people the directory lists in each hall</p>
              ${bars(stats.people.byDorm.slice(0, 16).map((d) => ({ label: d.key, value: d.n })))}
            </section>
            <section><h2>classes</h2>
              <p class="note">everybody the directory gives a class year</p>
              ${bars(
                stats.people.byClass.map((c) => ({ label: className(c.key), value: c.n })),
                { ink: "var(--blue)" },
              )}
            </section>
          </div>

          <section><h2>the major model</h2>
            <p class="note">accuracy against known majors, logged on every evaluation —
              the climb is the whole point of collecting another term</p>
            ${lines(
              stats.metrics.map((m) => ({ ...m, label: `${m.terms} · ${m.source}` })),
              [
                { name: "exact", of: (m) => m.exact },
                { name: "top 3", of: (m) => m.top3 },
                { name: "same school", of: (m) => m.cluster },
              ],
              { format: pct },
            )}
          </section>

          <div class="two">
            <section><h2>population over time</h2>
              <p class="note">directory rows appearing and vanishing, by month</p>
              ${lines(
                stats.population.map((m) => ({ ...m, label: m.month })),
                [
                  { name: "arrived", of: (m) => m.appeared },
                  { name: "left", of: (m) => m.vanished },
                ],
              )}
            </section>
            <section><h2>requests here</h2>
              <p class="note">calls to this engine over the last day</p>
              ${lines(
                traffic.overTime.map((h) => ({ ...h, label: `${h.hour.slice(11)}:00` })),
                [{ name: "requests", of: (h) => h.n }],
              )}
            </section>
          </div>

          <section><h2>collection</h2>
            <p class="note">every run that has touched this database</p>
            <div class="wrap"><table>
              <tr><th>when</th><th>what</th><th>by</th><th class="n">seen</th><th class="n">new</th>
                <th class="n">changed</th><th class="n">left</th><th>complete</th></tr>
              ${stats.sweeps
                .map(
                  (s) => `<tr><td>${s.startedAt.slice(0, 16).replace("T", " ")}</td><td>${s.kind}</td>
                    <td>${s.source}</td><td class="n">${n(s.seen)}</td><td class="n">${n(s.added)}</td>
                    <td class="n">${n(s.changed)}</td><td class="n">${n(s.vanished)}</td>
                    <td>${s.complete ? "yes" : s.finishedAt ? "partial" : "running"}</td></tr>`,
                )
                .join("")}
            </table></div>
          </section>`;

        foot.textContent =
          `${n(traffic.total)} requests in 24h · p50 ${traffic.p50}ms · ` +
          `p95 ${traffic.p95}ms · ${traffic.errors} errors`;
      }

      document.getElementById("forget").onclick = () => {
        localStorage.removeItem(KEY);
        gate("");
      };

      if (localStorage.getItem(KEY)) load();
      else gate("");
    </script>
  </body>
</html>
