<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cedarstalk setup</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #f3eee7; --dim: rgba(243, 238, 231, 0.6); --bg: #0d0b0a;
        --pink: #ff87d7; --blue: #5b9dff; --aqua: #2fd39a; --red: #ff6b6b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg); color: var(--ink); overflow-x: hidden; min-height: 100vh;
        font: 14px/1.6 "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        display: grid; justify-items: center; align-items: start; align-content: start; padding: max(2rem, 12vh) 1rem 3rem;
      }
      .blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; filter: blur(70px); }
      .blob { position: absolute; border-radius: 50%; opacity: 0.5; animation: drift 18s ease-in-out infinite alternate; }
      .b1 { width: 420px; height: 420px; background: var(--pink); top: -120px; left: -100px; }
      .b2 { width: 380px; height: 380px; background: var(--blue); bottom: -140px; right: -80px; animation-delay: -6s; }
      .b3 { width: 300px; height: 300px; background: var(--aqua); top: 40%; left: 55%; opacity: 0.3; animation-delay: -12s; }
      @keyframes drift { 50% { transform: translate(80px, 60px) scale(1.15); } 100% { transform: translate(-60px, 30px) scale(0.9); } }

      main {
        position: relative; z-index: 1; width: 100%; max-width: 480px; padding: 2.2rem 1.6rem; border-radius: 24px;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
        backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 20px 60px rgba(0,0,0,0.45);
      }
      h1 { font-family: "Instrument Serif", Georgia, serif; font-size: 2.3rem; font-weight: 400; text-align: center; }
      h1 em { color: var(--pink); font-style: normal; }
      .tag { color: var(--dim); font-size: 13px; text-align: center; margin: 0.2rem 0 1.6rem; }

      input {
        width: 100%; color: var(--ink); font: inherit; font-size: 15px; padding: 0.85rem 0.9rem; border-radius: 14px;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); outline: none;
      }
      input:focus { border-color: rgba(255,135,215,0.6); box-shadow: 0 0 0 4px rgba(255,135,215,0.12); }
      .btn {
        display: block; width: 100%; margin-top: 1rem; border: 1px solid rgba(255,255,255,0.25);
        font: inherit; font-weight: 700; font-size: 15px; padding: 0.9rem; border-radius: 14px; cursor: pointer;
        color: #14120f; background: linear-gradient(135deg, #ffa3e2, var(--pink)); text-align: center; text-decoration: none;
        box-shadow: 0 8px 24px rgba(255,135,215,0.3), inset 0 1px 0 rgba(255,255,255,0.5);
        transition: transform 0.2s;
      }
      .btn:hover { transform: translateY(-2px); }
      .btn:disabled { opacity: 0.6; transform: none; cursor: default; }
      .err { color: var(--red); font-size: 13px; margin-top: 0.7rem; min-height: 1em; }
      .hint { color: var(--dim); font-size: 12.5px; margin-top: 0.7rem; }

      .step {
        display: grid; grid-template-columns: 28px 1fr; gap: 0.3rem 0.8rem; padding: 1rem 0;
        border-top: 1px solid rgba(255,255,255,0.08); opacity: 0; animation: rise 0.45s ease forwards;
      }
      .step:nth-child(2) { animation-delay: 0.08s; } .step:nth-child(3) { animation-delay: 0.16s; } .step:nth-child(4) { animation-delay: 0.24s; }
      @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
      .dot {
        width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700;
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
      }
      .dot.ok { background: var(--aqua); color: #0d0b0a; border-color: transparent; }
      .dot.wait { border-color: var(--pink); animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(255,135,215,0.15); } }
      .step b { font-weight: 500; }
      .step p { grid-column: 2; color: var(--dim); font-size: 12.5px; }
      .step code { color: var(--aqua); font-size: 12px; word-break: break-all; }
      .copy {
        font: inherit; font-size: 12px; padding: 0.3rem 0.7rem; border-radius: 9px; cursor: pointer; margin-top: 0.4rem;
        color: var(--ink); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      }
      a { color: var(--blue); }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; opacity: 1 !important; } }
      /* hidden until the web fonts land, so the swap never reflows visibly */
      main { opacity: 0; }
      html.ready main { opacity: 1; transition: opacity 0.35s ease; }
      .credit { position: relative; z-index: 1; text-align: center; font-size: 11.5px; color: var(--dim); margin-top: 1.4rem; }
      .credit a { color: var(--dim); }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var done = function () { document.documentElement.classList.add("ready"); };
        // fonts.ready resolves before any download starts, so ask for each face explicitly.
        if (document.fonts && document.fonts.load) {
          Promise.all([
            document.fonts.load('400 1em "JetBrains Mono"'),
            document.fonts.load('700 1em "JetBrains Mono"'),
            document.fonts.load('400 1em "Instrument Serif"'),
          ]).then(done, done);
        } else done();
        setTimeout(done, 1500);
      })();
    </script>
    <div class="blobs" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
    <main>
      <h1>cedar<em>stalk</em></h1>
      <p class="tag" id="tag">almost there</p>
      <div id="app"></div>
    </main>
    <p class="credit">built on <a href="https://tangled.org/dunkirk.sh/cedarengine" target="_blank">cedarengine</a> by <a href="https://dunkirk.sh" target="_blank">Kieran Klukas</a></p>

    <script type="module">
      const KEY = "cedarengine.token";
      const app = document.getElementById("app");
      const $ = (id) => document.getElementById(id);
      const escape = (t) => String(t ?? "").replace(/[<>&"]/g, (c) => `&#${c.charCodeAt(0)};`);
      const getJSON = async (path, opts) => {
        const res = await fetch(path, opts);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `${path} returned ${res.status}`);
        return data;
      };

      function tokenForm(configured, message = "") {
        $("tag").textContent = configured ? "paste your token to continue" : "paste the token you got from the website";
        app.innerHTML = `
          <input id="tok" placeholder="your token" autocomplete="off" spellcheck="false" />
          <button class="btn" id="go">Continue</button>
          <p class="err" id="err">${escape(message)}</p>
          <p class="hint">Don't have one? Get it at <a href="https://cedarstalk.netlify.app" target="_blank">cedarstalk.netlify.app</a>.</p>`;
        $("tok").focus();
        const submit = async () => {
          const token = $("tok").value.trim();
          $("go").disabled = true;
          $("go").textContent = "Checking…";
          try {
            if (configured) {
              const res = await fetch("/v1/sync/manifest", { headers: { authorization: `Bearer ${token}` } });
              if (!res.ok) throw new Error("that's not the token this copy was set up with");
            } else {
              await getJSON("/setup/token", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ token }),
              });
            }
            localStorage.setItem(KEY, token);
            steps(token);
          } catch (e) {
            tokenForm(configured, e.message);
          }
        };
        $("go").onclick = submit;
        $("tok").onkeydown = (e) => { if (e.key === "Enter") submit(); };
      }

      // Every Chromium browser has its own address for the extensions page, and
      // none of them can be linked to from a web page -- so copy, don't link.
      const BROWSERS = {
        chrome: { name: "Chrome", page: "chrome://extensions" },
        edge: { name: "Edge", page: "edge://extensions" },
        brave: { name: "Brave", page: "brave://extensions" },
        opera: { name: "Opera", page: "opera://extensions" },
        vivaldi: { name: "Vivaldi", page: "vivaldi://extensions" },
        arc: { name: "Arc", page: "chrome://extensions" },
      };
      function detectBrowser() {
        const ua = navigator.userAgent;
        if (/Firefox\//.test(ua)) return "firefox";
        if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) return "safari";
        if (/Edg\//.test(ua)) return "edge";
        if (/OPR\//.test(ua)) return "opera";
        if (/Vivaldi/.test(ua)) return "vivaldi";
        if (navigator.brave) return "brave";
        if (getComputedStyle(document.documentElement).getPropertyValue("--arc-palette-title")) return "arc";
        return "chrome";
      }
      function showBrowser(key) {
        const b = BROWSERS[key];
        const others = Object.keys(BROWSERS).filter((k) => k !== key);
        if (!b) {
          $("browserLine").innerHTML = `This extension needs <b>Chrome</b>, <b>Edge</b>, Brave, Arc, Opera or Vivaldi — it doesn't run in ${key === "firefox" ? "Firefox" : "Safari"}. Open this page in one of those instead.`;
          $("copyExt").style.display = "none";
        } else {
          $("browserLine").innerHTML = `Looks like you're using <b>${b.name}</b>. Its extensions page is <code>${b.page}</code>.`;
          $("copyExt").style.display = "";
          $("copyExt").textContent = `Copy ${b.page}`;
          copyButton("copyExt", b.page);
        }
        $("browserSwitch").innerHTML = "Not right? " + others.map((k) => `<a href="#" data-browser="${k}">${BROWSERS[k].name}</a>`).join(" · ");
        for (const a of $("browserSwitch").querySelectorAll("a")) {
          a.onclick = (e) => { e.preventDefault(); showBrowser(a.dataset.browser); };
        }
      }

      function copyButton(id, text) {
        const b = $(id);
        b.onclick = async () => { await navigator.clipboard.writeText(text); b.textContent = "Copied ✓"; };
      }

      function steps(token) {
        $("tag").textContent = "you're in — a few last things";
        const isMac = /Mac/.test(navigator.platform);
        const raycast = isMac || /Win/.test(navigator.platform);
        const addFile = isMac ? "Add to Raycast.command" : "Add to Raycast.cmd";
        const port = location.port || "80";
        app.innerHTML = `
          <div>
            <div class="step"><span class="dot ok">✓</span><b>Token saved</b>
              <p id="collect">Downloading the course catalog and campus map in the background…</p></div>
            <div class="step"><span class="dot wait" id="extDot">2</span><b>Add the sync extension</b>
              <p id="browserLine"></p>
              <p><button class="copy" id="copyExt"></button>
              <span style="font-size:11.5px">then paste into your address bar and press Enter. Browsers don't let websites open this page for you.</span></p>
              <p id="browserSwitch" style="font-size:11.5px"></p>
              <p>There, turn on <b>Developer mode</b>, click <b>Load unpacked</b>, and pick this folder:</p>
              <p><code id="extPath">the "Browser extension" folder inside cedarstalk</code></p>
              <p><button class="copy" id="copyPath">Copy folder path</button>
              <span style="font-size:11.5px">— paste it into the folder picker${isMac ? " (press <b>⌘⇧G</b> first)" : "'s address box"}</span></p>
              <p id="extState">Then come back to this tab — it connects by itself.</p></div>
            ${raycast ? `<div class="step"><span class="dot">3</span><b>Raycast (optional)</b>
              <p>If you said yes in the launcher, it's installed. If not, double-click <code>${addFile}</code>
              in the cedarstalk folder -- it installs Raycast too if you don't have it. Then open Raycast and run any cedarstalk command.
              It'll ask for your token once${port !== "3000" ? ` and the address <code>${escape(location.origin)}</code>` : ""}.</p>
              <p><button class="copy" id="copyTok">Copy token</button></p></div>` : ""}
            <div class="step"><span class="dot">${raycast ? 4 : 3}</span><b>Next time: the Desktop icon</b>
              <p>From now on, just double-click the <b>cedarstalk</b> icon on your Desktop. It runs quietly in the background — no terminal to keep open — and opens in its own window. It stops when you restart your computer; the icon starts it again.</p></div>
          </div>
          <a class="btn" href="/">Open cedarstalk</a>`;
        showBrowser(detectBrowser());
        getJSON("/setup/state").then(({ extensionFolder }) => {
          if (!extensionFolder) return;
          $("extPath").textContent = extensionFolder;
          copyButton("copyPath", extensionFolder);
        });
        if (raycast) copyButton("copyTok", token);
        connectExtension(token);
        watchCollect();
      }

      // The extension's content script listens for this on localhost pages and
      // replies once it has saved the address and token.
      function connectExtension(token) {
        const ask = () => window.postMessage({ type: "cedarstalk-connect", token }, location.origin);
        const timer = setInterval(ask, 1500);
        ask();
        window.addEventListener("message", (e) => {
          if (e.source !== window || e.data?.type !== "cedarstalk-connected") return;
          clearInterval(timer);
          $("extDot").className = "dot ok";
          $("extDot").textContent = "✓";
          $("extState").innerHTML = e.data.firstTime
            ? "Connected — the first sync has started. If a Cedarville sign-in tab opens, sign in and it carries on."
            : "Connected.";
        });
      }

      async function watchCollect() {
        const labels = { catalog: "the course catalog", campus: "the campus map", book: "the printed catalog" };
        for (;;) {
          const { collecting } = await getJSON("/setup/state").catch(() => ({}));
          const el = $("collect");
          if (!el) return;
          if (!collecting || collecting === "done") {
            el.textContent = collecting === "done" ? "Course catalog and campus map downloaded." : "Public data is in place.";
            return;
          }
          el.textContent = `Downloading ${labels[collecting] ?? collecting} in the background…`;
          await new Promise((r) => setTimeout(r, 3000));
        }
      }

      const { configured } = await getJSON("/setup/state");
      const stored = localStorage.getItem(KEY);
      if (configured && stored) {
        const ok = await fetch("/v1/sync/manifest", { headers: { authorization: `Bearer ${stored}` } }).then((r) => r.ok, () => false);
        ok ? steps(stored) : tokenForm(true);
      } else {
        tokenForm(configured);
      }
    </script>
  </body>
</html>
