<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14120f" />
    <title>cedarstalk</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
       * The phone surface. This is deliberately a different, smaller page
       * rather than dashboard.html squeezed into a narrow column -- the
       * dashboard is dense analytics meant for a desk, and cramming it onto
       * a 375px screen would make everything worse at once. This has exactly
       * three things: find a quiet room, find a person, see who's in a
       * building. Reached over Tailscale, never publicly -- see README.
       */
      :root {
        --ink: #ece7df;
        --dim: #8b8378;
        --bg: #14120f;
        --panel: #1c1916;
        --line: #2b2621;
        --pink: #ff87d7;
        --blue: #3987e5;
        --aqua: #199e70;
        --violet: #9085e9;
        --orange: #d95926;
        --red: #d9534f;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        padding: env(safe-area-inset-top, 1rem) 1rem calc(env(safe-area-inset-bottom, 1rem) + 4.5rem);
        min-height: 100vh;
      }
      main { max-width: 560px; margin: 0 auto; }
      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 1.5rem;
        font-weight: 400;
        margin: 0.75rem 0 0.15rem;
      }
      h1 em { color: var(--pink); font-style: normal; }
      .sub { color: var(--dim); font-size: 12px; margin-bottom: 1.1rem; }
      h2 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 1.15rem;
        font-weight: 400;
        margin: 1.4rem 0 0.6rem;
      }
      .note { color: var(--dim); font-size: 12px; margin: -0.35rem 0 0.7rem; }
      .gate { margin: 3.5rem auto; }
      input, select {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--ink);
        font: inherit;
        font-size: 16px; /* iOS zooms the page if an input is smaller than this */
        padding: 0.85rem 0.9rem;
        margin: 0.5rem 0;
        border-radius: 10px;
        appearance: none;
      }
      select { background-image: none; }
      button {
        background: var(--pink);
        color: #14120f;
        border: 0;
        font: inherit;
        font-weight: 700;
        font-size: 16px;
        padding: 0.85rem 1.1rem;
        border-radius: 10px;
        cursor: pointer;
        width: 100%;
      }
      button.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
      button.link { background: none; color: var(--blue); font-weight: 400; width: auto; padding: 0.3rem 0; }
      .row { display: flex; gap: 0.5rem; align-items: center; }
      .err { color: var(--pink); font-size: 12px; }
      a { color: var(--blue); }
      footer { color: var(--dim); margin-top: 2.5rem; font-size: 11px; }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.9rem 1rem;
        margin-bottom: 0.6rem;
      }
      .card .title { font-weight: 700; font-size: 15px; }
      .card .meta { color: var(--dim); font-size: 12.5px; margin-top: 0.2rem; }
      .tag {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        margin-top: 0.4rem;
      }
      .tag.green { background: rgba(25, 158, 112, 0.18); color: var(--aqua); }
      .tag.blue { background: rgba(57, 135, 229, 0.18); color: var(--blue); }
      .tag.dim { background: rgba(139, 131, 120, 0.18); color: var(--dim); }
      .tag.red { background: rgba(217, 83, 79, 0.18); color: var(--red); }
      .empty { color: var(--dim); font-size: 13px; padding: 1rem 0; text-align: center; }
      .loading { color: var(--dim); font-size: 13px; padding: 0.5rem 0; }

      /* Bottom tab bar -- thumb reach matters more than a header on a phone. */
      nav.tabs {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        display: flex;
        background: var(--panel);
        border-top: 1px solid var(--line);
        padding: 0.4rem env(safe-area-inset-right, 0) calc(env(safe-area-inset-bottom, 0.4rem)) env(safe-area-inset-left, 0);
        z-index: 10;
      }
      nav.tabs button {
        flex: 1;
        background: none;
        color: var(--dim);
        font-size: 11px;
        font-weight: 700;
        border-radius: 8px;
        padding: 0.5rem 0.25rem;
      }
      nav.tabs button.active { color: var(--pink); background: rgba(255, 135, 215, 0.1); }
      .panel { display: none; }
      .panel.active { display: block; }
    </style>
  </head>
  <body>
    <main>
      <div id="body"></div>
      <footer id="foot"></footer>
    </main>
    <nav class="tabs" id="tabs" style="display: none">
      <button type="button" data-panel="rooms" class="active">Quiet Rooms</button>
      <button type="button" data-panel="people">Find Someone</button>
      <button type="button" data-panel="building">In a Building</button>
    </nav>

    <script type="module">
      // Same key as dashboard.html deliberately -- one token per browser,
      // whichever page asks for it first.
      const KEY = "cedarengine.token";
      const body = document.getElementById("body");
      const foot = document.getElementById("foot");
      const tabs = document.getElementById("tabs");
      const escape = (text) =>
        String(text ?? "").replace(/[<>&"]/g, (c) => `&#${c.charCodeAt(0)};`);

      const api = async (path) => {
        const res = await fetch(path, {
          headers: { authorization: `Bearer ${localStorage.getItem(KEY) ?? ""}` },
        });
        if (res.status === 401) throw new Error("unauthorised");
        if (!res.ok) throw new Error(`${path} returned ${res.status}`);
        return res.json();
      };

      function gate(message = "") {
        tabs.style.display = "none";
        body.innerHTML = `
          <h1>cedar<em>stalk</em></h1>
          <p class="sub">reached over your tailnet — never a public address</p>
          <div class="gate">
            <p>This holds real people's rooms and phone numbers. Paste the bearer token from your <code>.env</code>.</p>
            <input id="token" type="password" placeholder="BEARER_TOKEN" autocapitalize="off" autocorrect="off" />
            <button id="go">Unlock</button>
            <p class="err">${escape(message)}</p>
          </div>`;
        const submit = () => {
          localStorage.setItem(KEY, document.getElementById("token").value.trim());
          boot();
        };
        document.getElementById("go").onclick = submit;
        document.getElementById("token").onkeydown = (e) => {
          if (e.key === "Enter") submit();
        };
      }

      // ── Quiet rooms ──────────────────────────────────────────────────────

      let buildingsCache = null;
      async function buildings() {
        if (buildingsCache) return buildingsCache;
        const data = await api("/v1/campus/buildings");
        buildingsCache = (data.buildings ?? []).sort((a, b) => a.label.localeCompare(b.label));
        return buildingsCache;
      }

      function roomCard(room) {
        const free =
          room.freeMinutes >= 600
            ? "free rest of day"
            : room.freeMinutes < 60
              ? `free ${room.freeMinutes} min`
              : `free ${Math.floor(room.freeMinutes / 60)}h ${room.freeMinutes % 60 ? (room.freeMinutes % 60) + "m" : ""}`;
        const walk =
          room.minutes != null
            ? room.minutes < 1
              ? "under a min away"
              : `${Math.round(room.minutes)} min away`
            : null;
        return `<div class="card">
          <div class="title">${escape(room.building)} ${escape(room.room)}</div>
          <div class="meta">${free}${walk ? " · " + walk : ""}</div>
          <span class="tag ${room.gem ? "green" : "dim"}">quiet ${room.quiet}</span>
        </div>`;
      }

      async function loadRooms(near) {
        const panel = document.getElementById("panel-rooms-list");
        panel.innerHTML = `<div class="loading">looking…</div>`;
        try {
          const q = near ? `&near=${encodeURIComponent(near)}` : "";
          const data = await api(`/v1/rooms/quiet?horizon=60${q}`);
          const rooms = data.rooms ?? [];
          if (!rooms.length) {
            panel.innerHTML = `<div class="empty">Nothing free for an hour right now. Try again once classes let out.</div>`;
            return;
          }
          const gems = rooms.filter((r) => r.gem).slice(0, 12);
          const rest = rooms.filter((r) => !r.gem).slice(0, 6);
          panel.innerHTML =
            gems.map(roomCard).join("") +
            (rest.length ? `<h2>Also free</h2>` + rest.map(roomCard).join("") : "");
        } catch (e) {
          panel.innerHTML = `<div class="empty err">${escape(e.message)}</div>`;
        }
      }

      async function renderRooms() {
        const panel = document.getElementById("panel-rooms");
        panel.innerHTML = `
          <h2>Quiet Rooms</h2>
          <p class="note">unscheduled classrooms right now — not necessarily unlocked</p>
          <select id="rooms-near"><option value="">Anywhere on campus</option></select>
          <div id="panel-rooms-list"></div>`;
        const select = document.getElementById("rooms-near");
        buildings().then((list) => {
          for (const b of list) {
            const opt = document.createElement("option");
            opt.value = b.label;
            opt.textContent = b.label;
            select.appendChild(opt);
          }
        });
        select.onchange = () => loadRooms(select.value);
        loadRooms("");
      }

      // ── Find a person ────────────────────────────────────────────────────

      let searchTimer = null;
      function renderPeople() {
        const panel = document.getElementById("panel-people");
        panel.innerHTML = `
          <h2>Find Someone</h2>
          <p class="note">name, and where they're scheduled to be right now</p>
          <input id="people-q" type="text" placeholder="Name" autocapitalize="words" />
          <div id="panel-people-list"></div>`;
        document.getElementById("people-q").oninput = (e) => {
          clearTimeout(searchTimer);
          const q = e.target.value.trim();
          const list = document.getElementById("panel-people-list");
          if (q.length < 2) {
            list.innerHTML = "";
            return;
          }
          searchTimer = setTimeout(() => searchPeople(q), 300);
        };
      }

      async function searchPeople(q) {
        const list = document.getElementById("panel-people-list");
        list.innerHTML = `<div class="loading">searching…</div>`;
        try {
          const data = await api(`/v1/people?q=${encodeURIComponent(q)}&limit=15`);
          const people = data.people ?? [];
          if (!people.length) {
            list.innerHTML = `<div class="empty">No one matches "${escape(q)}"</div>`;
            return;
          }
          list.innerHTML = people
            .map((p) => {
              const name = `${p.nickname ?? p.firstName ?? ""} ${p.lastName ?? ""}`.trim() || p.id;
              const place = p.dormName ?? p.department ?? "";
              return `<div class="card" data-id="${p.id}" data-name="${escape(name)}" style="cursor:pointer">
                <div class="title">${escape(name)}</div>
                <div class="meta">${escape(place)}</div>
              </div>`;
            })
            .join("");
          for (const card of list.querySelectorAll(".card")) {
            card.onclick = () => showLocation(card.dataset.id, card.dataset.name);
          }
        } catch (e) {
          list.innerHTML = `<div class="empty err">${escape(e.message)}</div>`;
        }
      }

      async function showLocation(id, name) {
        const list = document.getElementById("panel-people-list");
        list.innerHTML = `<div class="loading">looking…</div>`;
        try {
          const loc = await api(`/v1/people/${encodeURIComponent(id)}/location/now`);
          let html = `<button class="ghost link" id="back-to-search">&larr; back to search</button>
            <div class="card"><div class="title">${escape(name)}</div>`;
          if (loc.status === "in class" && loc.inClass) {
            html += `<div class="meta">${escape(loc.inClass.building ?? "")} ${escape(loc.inClass.room ?? "")} — ${escape(loc.inClass.title ?? loc.inClass.section)}</div>
              <span class="tag red">in class until ${escape(loc.inClass.endsAt)}</span>`;
          } else if (loc.location) {
            html += `<div class="meta">Best guess: ${escape(loc.location.label)}${loc.location.room ? " " + escape(loc.location.room) : ""}</div>
              <span class="tag ${loc.status === "free" ? "green" : "dim"}">${escape(loc.status)}</span>`;
          } else {
            html += `<div class="meta">No timetable and nowhere listed for them.</div>`;
          }
          html += `</div>`;
          list.innerHTML = html;
          document.getElementById("back-to-search").onclick = () => {
            document.getElementById("people-q").focus();
            list.innerHTML = "";
          };
        } catch (e) {
          list.innerHTML = `<div class="empty err">${escape(e.message)}</div>`;
        }
      }

      // ── Who's in a building ──────────────────────────────────────────────

      async function renderBuilding() {
        const panel = document.getElementById("panel-building");
        panel.innerHTML = `
          <h2>In a Building</h2>
          <p class="note">who's scheduled here this minute, from the timetable</p>
          <select id="building-pick"><option value="">Pick a building…</option></select>
          <div id="panel-building-list"></div>`;
        const select = document.getElementById("building-pick");
        buildings().then((list) => {
          for (const b of list) {
            const opt = document.createElement("option");
            opt.value = b.label;
            opt.textContent = b.label;
            select.appendChild(opt);
          }
        });
        select.onchange = () => loadBuilding(select.value);
      }

      async function loadBuilding(name) {
        const list = document.getElementById("panel-building-list");
        if (!name) {
          list.innerHTML = "";
          return;
        }
        list.innerHTML = `<div class="loading">looking…</div>`;
        try {
          const data = await api(`/v1/buildings/${encodeURIComponent(name)}/who`);
          if (!data.sections?.length) {
            list.innerHTML = `<div class="empty">Nothing scheduled here right now.</div>`;
            return;
          }
          list.innerHTML =
            `<div class="card"><div class="title">${data.people} people</div><div class="meta">${data.sections.length} sections meeting now</div></div>` +
            data.sections
              .map((s) => {
                const cov =
                  s.coverage == null
                    ? `<span class="tag dim">no roster</span>`
                    : s.coverage >= 0.9
                      ? `<span class="tag green">${s.students.length}/${s.enrolled ?? "?"}</span>`
                      : `<span class="tag blue">${s.students.length}/${s.enrolled ?? "?"}</span>`;
                const names = s.students
                  .slice(0, 6)
                  .map((st) => escape(st.name ?? "#" + st.id))
                  .join(", ");
                return `<div class="card">
                  <div class="title">${escape(s.name ?? "")} · rm ${escape(s.room)}</div>
                  <div class="meta">${escape(s.start)}–${escape(s.end)} · ${escape(s.title ?? "")}</div>
                  ${names ? `<div class="meta">${names}${s.students.length > 6 ? "…" : ""}</div>` : ""}
                  ${cov}
                </div>`;
              })
              .join("");
        } catch (e) {
          list.innerHTML = `<div class="empty err">${escape(e.message)}</div>`;
        }
      }

      // ── Shell ─────────────────────────────────────────────────────────────

      function switchTab(name) {
        for (const btn of tabs.querySelectorAll("button")) {
          btn.classList.toggle("active", btn.dataset.panel === name);
        }
        for (const panel of document.querySelectorAll(".panel")) {
          panel.classList.toggle("active", panel.id === `panel-${name}`);
        }
      }

      async function boot() {
        try {
          const health = await api("/health");
          tabs.style.display = "flex";
          // Only ever present on an instance run under a cedarstalk-access
          // token -- absent here means absent, no banner, nothing to render.
          const banner = health.accessFlagged
            ? `<div style="background:#3a1414;border:1px solid var(--red);border-radius:10px;padding:0.8rem 1rem;margin-bottom:1rem;color:var(--red);font-size:12.5px">${escape(health.accessMessage ?? "This token has been flagged.")}</div>`
            : "";
          body.innerHTML = `
            ${banner}
            <div class="panel active" id="panel-rooms"></div>
            <div class="panel" id="panel-people"></div>
            <div class="panel" id="panel-building"></div>`;
          renderRooms();
          renderPeople();
          renderBuilding();
          for (const btn of tabs.querySelectorAll("button")) {
            btn.onclick = () => switchTab(btn.dataset.panel);
          }
          foot.textContent = `${health.people?.toLocaleString?.() ?? health.people} people on record`;
        } catch (e) {
          gate(e.message === "unauthorised" ? "Wrong token." : e.message);
        }
      }

      if (localStorage.getItem(KEY)) boot();
      else gate();
    </script>
  </body>
</html>
